name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the runner's Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$sdkmanager_path" ]; then
            echo "::error::Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: bash ./gradlew --no-daemon :app:assembleVer_releaseDebug

      - name: Symbolize the NVEvent crash
        shell: bash
        run: |
          symbolizer="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-addr2line"
          libraries="$(find app -type f -path '*/cxx/*' -name libmultiplayer.so -print)"
          if [ -z "$libraries" ]; then
            echo "::warning::Unstripped libmultiplayer.so was not found."
            exit 0
          fi
          while IFS= read -r library; do
            echo "Symbols for $library:"
            "$symbolizer" -fC -e "$library" 0x1b1ba0
          done <<< "$libraries"

      - uses: actions/upload-artifact@v4
        with:
          name: Rockstar-RolePLay-debug
          path: app/build/outputs/apk/ver_release/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Rockstar-RolePLay-native-symbols
          path: app/build/intermediates/cxx/Debug/**/obj/*/libmultiplayer.so
          if-no-files-found: warn
