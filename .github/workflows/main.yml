name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Firebase when provided
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python -m json.tool app/google-services.json > /dev/null
          else
            echo "::notice::Firebase config not provided; building without Firebase crash reporting."
          fi

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleVer_releaseDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Rockstar-RolePLay-debug
          path: app/build/outputs/apk/ver_release/debug/*.apk
          if-no-files-found: error
